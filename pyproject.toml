[project]
name = "second-brain-distill"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["distill.py", "distiller", "tests"]
